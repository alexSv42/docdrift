# Root document. The only file here with an `openapi:` key — which is what makes it the only file
# Redocly can lint directly. Everything else is reached through $ref.
openapi: 3.1.0
info:
  title: Projects API
  version: 1.0.0
  description: Manage projects.
servers:
  - url: https://api.example.com/v3
security:
  - BearerAuth: []
paths:
  /v3/projects:
    $ref: './paths/projects.yaml'
  /v3/projects/{id}:
    $ref: './paths/project-by-id.yaml'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    ProjectStatus:
      $ref: './components/schemas/project-status.yaml'
    Project:
      $ref: './components/schemas/project.yaml'
